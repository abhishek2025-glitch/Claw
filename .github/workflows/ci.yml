name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run test suite
        env:
          WEBHOOK_SECRET: dummy_webhook_secret_ci
          AGENTSHIELD_SECRET: dummy_agentshield_secret_ci
        run: npm test

      - name: Build Next.js application
        env:
          WEBHOOK_SECRET: dummy_webhook_secret_ci
          AGENTSHIELD_SECRET: dummy_agentshield_secret_ci
        run: npm run build
