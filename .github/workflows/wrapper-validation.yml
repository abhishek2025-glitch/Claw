name: Wrapper Validation

on:
  push:
    branches: [ci/wrapper-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Build and wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Environment
        run: |
          node -v && npm -v && python3 --version
          git log -1 --oneline
          echo "files tracked: $(git ls-files | wc -l)"

      - name: Install (npm ci)
        id: install
        run: |
          if npm ci --no-audit --no-fund; then
            echo "INSTALL|npm ci OK"
          else
            echo "INSTALL|npm ci FAILED - package-lock.json is out of sync with package.json; falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Unit tests (enforcement suite)
        id: unit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Next.js production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          WEBHOOK_SECRET: ci-dummy-secret
          AGENTSHIELD_SECRET: ci-dummy-secret
        run: npm run build

      - name: Server smoke test (built app)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          export NODE_ENV=production WEBHOOK_SECRET=ci-secret AGENTSHIELD_SECRET=ci-secret
          npx next start -p 3000 > "$RUNNER_TEMP/server.log" 2>&1 &
          PID=$!
          for i in $(seq 1 40); do curl -s -o /dev/null 127.0.0.1:3000/ && break; sleep 1; done
          req() {
            local label="$1"; shift
            local out; out=$(curl -s -m 15 -w '\nHTTP_STATUS=%{http_code}' "$@")
            echo "SMOKE|$label|$(echo "$out" | tail -n 1)|$(echo "$out" | head -n -1 | head -c 220 | tr '\n' ' ')"
          }
          H='content-type: application/json'
          req "GET /" 127.0.0.1:3000/
          req "GET /api/metrics" 127.0.0.1:3000/api/metrics
          req "GET /api/agents" 127.0.0.1:3000/api/agents
          req "GET /api/actions/pending" 127.0.0.1:3000/api/actions/pending
          req "GET /api/licenses" 127.0.0.1:3000/api/licenses
          req "GET /api/auth/me" 127.0.0.1:3000/api/auth/me
          req "GET /api/cli/install.sh" 127.0.0.1:3000/api/cli/install.sh
          req "POST /api/webhook (no auth)" -X POST -H "$H" -d '{}' 127.0.0.1:3000/api/webhook
          req "POST /api/actions/propose (no auth)" -X POST -H "$H" -d '{}' 127.0.0.1:3000/api/actions/propose
          req "POST /api/actions/approve (no auth)" -X POST -H "$H" -d '{"actionId":"nonexistent"}' 127.0.0.1:3000/api/actions/approve
          req "POST /api/agents/ping (no auth)" -X POST -H "$H" -d '{}' 127.0.0.1:3000/api/agents/ping
          kill $PID 2>/dev/null
          echo "SMOKE|server log tail:"
          tail -n 25 "$RUNNER_TEMP/server.log"

      - name: Retest - license, billing and auth fixes
        id: monetize
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          export NODE_ENV=production WEBHOOK_SECRET=ci-secret AGENTSHIELD_SECRET=ci-secret DODO_WEBHOOK_SECRET=ci-dodo-secret
          unset DODO_PAYMENTS_API_KEY DODO_PAYMENTS_MODE DATABASE_URL

          cat > "$RUNNER_TEMP/gen.mjs" <<'EOF'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const k = crypto.generateKeyPairSync('ed25519');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/pub.pem', k.publicKey.export({type:'spki',format:'pem'}));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/priv.pem', k.privateKey.export({type:'pkcs8',format:'pem'}));
          EOF
          node "$RUNNER_TEMP/gen.mjs"
          export AGENTSHIELD_LICENSE_PUBLIC_KEY="$(cat "$RUNNER_TEMP/pub.pem")"
          export LICENSE_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/priv.pem")"

          cat > "$RUNNER_TEMP/lic.mts" <<'EOF'
          import fs from 'node:fs';
          const m = await import(process.env.GITHUB_WORKSPACE + '/lib/license/index.ts');
          const lic = m.issueSignedLicense({licenseId:'ci-1',plan:'PRO_LIFETIME',customerId:'ci@example.com',organizationId:'org-ci',issuedAt:new Date().toISOString(),maxDevices:5,features:['A']});
          const v = m.verifyLicenseOffline(lic.licenseKey);
          console.log('RETEST|server_issue_and_verify_with_matching_keypair|valid=' + v.valid + ' (expect true)');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/issued-key.txt', lic.licenseKey);
          const noKey = process.env.LICENSE_SIGNING_PRIVATE_KEY;
          delete process.env.LICENSE_SIGNING_PRIVATE_KEY;
          try { m.issueSignedLicense({licenseId:'ci-2',plan:'PRO_LIFETIME',customerId:'x',organizationId:'x',issuedAt:new Date().toISOString(),maxDevices:1,features:[]}); console.log('RETEST|issue_without_signing_key|ISSUED (expect throw)'); }
          catch (e) { console.log('RETEST|issue_without_signing_key|threw (expected)'); }
          process.env.LICENSE_SIGNING_PRIVATE_KEY = noKey;
          EOF
          npx tsx "$RUNNER_TEMP/lic.mts" 2>&1 | grep -E "RETEST|Error" | head -n 6

          export HOME="$RUNNER_TEMP/h2"; mkdir -p "$HOME"
          node packages/cli/bin/agentshield.mjs activate "$(cat "$RUNNER_TEMP/issued-key.txt")" < /dev/null > /dev/null 2>&1
          echo "RETEST|cli_activate_server_issued_license_with_matching_public_key|exit=$? (expect 0)"
          env -u AGENTSHIELD_LICENSE_PUBLIC_KEY node packages/cli/bin/agentshield.mjs activate "$(cat "$RUNNER_TEMP/issued-key.txt")" < /dev/null > /dev/null 2>&1
          echo "RETEST|cli_activate_same_license_with_embedded_default_key|exit=$? (expect non-zero, embedded key is not yours yet)"

          PORT=3101 npx next start -p 3101 > "$RUNNER_TEMP/server1.log" 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null 127.0.0.1:3101/ && break; sleep 1; done
          cat > "$RUNNER_TEMP/chain.mjs" <<'EOF'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const base = 'http://127.0.0.1:3101';
          const out = (k, v) => console.log('RETEST|' + k + '|' + v);
          const evt = (id) => JSON.stringify({id, type:'payment.succeeded', created_at:new Date().toISOString(), data:{payment_id:'pay_'+id, order_id:'ord_'+id, customer:{email:'buyer@example.com'}, metadata:{organization_id:'org-ci'}, total_amount:4900, currency:'USD', status:'succeeded'}});
          const sign = (secret, body) => crypto.createHmac('sha256', secret).update(body).digest('hex');
          async function post(p, headers, body) { const r = await fetch(base + p, {method:'POST', headers:{'content-type':'application/json', ...headers}, body}); return {status:r.status, text:await r.text()}; }
          let b = evt('evt_forged_' + Date.now());
          let r = await post('/api/billing/webhook/dodo', {'webhook-signature': sign('whsec_dodo_agentshield_live_942a', b)}, b);
          out('forged_webhook_with_old_default_secret', r.status + ' (expect 401)');
          b = evt('evt_real_' + Date.now());
          r = await post('/api/billing/webhook/dodo', {'webhook-signature': sign(process.env.DODO_WEBHOOK_SECRET, b)}, b);
          out('valid_signed_webhook', r.status + ' response_has_licenseKey=' + /licenseKey/.test(r.text) + ' (expect 200, false)');
          const dup = await post('/api/billing/webhook/dodo', {'webhook-signature': sign(process.env.DODO_WEBHOOK_SECRET, b)}, b);
          out('duplicate_event_replay', dup.status + ' ' + dup.text.slice(0, 80));
          let l = await fetch(base + '/api/licenses?orgId=org-ci');
          out('GET_api_licenses_without_auth', l.status + ' (expect 401)');
          l = await fetch(base + '/api/licenses?orgId=org-ci', {headers:{authorization:'Bearer ' + process.env.WEBHOOK_SECRET}});
          const lj = await l.json().catch(() => ({}));
          const list = lj.licenses || [];
          out('GET_api_licenses_with_auth', l.status + ' count=' + list.length + ' first_isValid=' + (list[0] && list[0].isValid) + ' (expect 200, 1, true)');
          const key = list[0] && list[0].licenseKey;
          if (key) {
            const a = await post('/api/licenses/activate', {}, JSON.stringify({licenseKey:key, deviceId:'ci-dev', deviceName:'ci', os:'linux'}));
            let aj = {}; try { aj = JSON.parse(a.text); } catch {}
            out('activate_issued_license_via_api', a.status + ' success=' + Boolean(aj.success) + (aj.error ? ' error=' + aj.error : ''));
            fs.writeFileSync(process.env.RUNNER_TEMP + '/chain-key.txt', key);
          }
          EOF
          node "$RUNNER_TEMP/chain.mjs" 2>&1 | grep -E "RETEST|Error" 
          if [ -f "$RUNNER_TEMP/chain-key.txt" ]; then
            node packages/cli/bin/agentshield.mjs activate "$(cat "$RUNNER_TEMP/chain-key.txt")" < /dev/null > /dev/null 2>&1
            echo "RETEST|cli_activate_license_from_full_payment_chain|exit=$? (expect 0)"
          fi
          CLIP="node packages/cli/bin/agentshield.mjs"
          $CLIP test-connection --endpoint http://127.0.0.1:3101 --secret ci-secret < /dev/null > "$RUNNER_TEMP/tc-ok.txt" 2>&1
          echo "RETEST|test_connection_valid_secret|exit=$? (expect 0)"
          $CLIP test-connection --endpoint http://127.0.0.1:3101 --secret wrong-secret < /dev/null > "$RUNNER_TEMP/tc-bad.txt" 2>&1
          echo "RETEST|test_connection_wrong_secret|exit=$? (expect 1)"
          echo "RETEST|metrics_before=$(curl -s -H 'authorization: Bearer ci-secret' 127.0.0.1:3101/api/metrics | head -c 160)"
          $CLIP wrap --endpoint http://127.0.0.1:3101 --secret ci-secret --agent TelemetryProbe -- node -e "console.log('hello telemetry')" < /dev/null > "$RUNNER_TEMP/telemetry.txt" 2>&1
          echo "RETEST|wrap_with_endpoint_exit=$?"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/telemetry.txt" | grep -iE "telemetry|sync|flush|upload|queue" | head -n 4
          echo "RETEST|metrics_after=$(curl -s -H 'authorization: Bearer ci-secret' 127.0.0.1:3101/api/metrics | head -c 160)"
          pkill -f "next start" 2>/dev/null; pkill -f "next-server" 2>/dev/null; sleep 3

          env -u WEBHOOK_SECRET -u AGENTSHIELD_SECRET -u DODO_WEBHOOK_SECRET -u LICENSE_SIGNING_PRIVATE_KEY -u AGENTSHIELD_LICENSE_PUBLIC_KEY npx next start -p 3102 > "$RUNNER_TEMP/server2.log" 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null 127.0.0.1:3102/ && break; sleep 1; done
          req2() { local label="$1"; shift; local code; code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$@"); echo "RETEST|no_secrets_in_production|$label=$code"; }
          J='content-type: application/json'
          req2 "GET /api/licenses (expect 401)" 127.0.0.1:3102/api/licenses
          req2 "POST /api/actions/approve (expect 401 or 503)" -X POST -H "$J" -d '{"actionId":"x"}' 127.0.0.1:3102/api/actions/approve
          req2 "POST /api/actions/propose (expect 401 or 503)" -X POST -H "$J" -d '{}' 127.0.0.1:3102/api/actions/propose
          req2 "POST /api/webhook (expect 401 or 503)" -X POST -H "$J" -d '{}' 127.0.0.1:3102/api/webhook
          req2 "POST /api/agents/ping (expect 401 or 503)" -X POST -H "$J" -d '{}' 127.0.0.1:3102/api/agents/ping
          req2 "POST /api/billing/webhook/dodo (expect 401)" -X POST -H "$J" -H 'webhook-signature: deadbeef' -d '{}' 127.0.0.1:3102/api/billing/webhook/dodo
          req2 "POST /api/billing/checkout (expect 503)" -X POST -H "$J" -d '{"customerEmail":"b@example.com","customerName":"B"}' 127.0.0.1:3102/api/billing/checkout
          pkill -f "next start" 2>/dev/null; pkill -f "next-server" 2>/dev/null

      - name: Wrapper CLI probes
        id: cli
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          export HOME="$RUNNER_TEMP/clihome"; mkdir -p "$HOME"
          CLIF=packages/cli/bin/agentshield.mjs; export CLIF
          CLI="node $GITHUB_WORKSPACE/$CLIF"
          probe() {
            local name="$1"; shift
            echo "::group::PROBE $name"
            timeout 60 "$@" < /dev/null 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -n 45
            local rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "PROBE_RESULT|$name|exit=$rc"
          }
          probe "version" $CLI version
          probe "help" $CLI help
          probe "init" $CLI init
          probe "doctor" $CLI doctor
          probe "policy" $CLI policy
          probe "policy-validate" $CLI policy validate
          probe "status" $CLI status
          probe "wrap-clean-agent" $CLI wrap -- node -e "console.log('hello from agent')"
          probe "wrap-rm-rf-fast-exit" $CLI wrap -- node -e "console.log('rm -rf /')"
          probe "wrap-sudo-then-continues" $CLI wrap -- node -e "console.log('sudo ls /root'); setTimeout(function(){console.log('AGENT STILL RUNNING AFTER GUARDRAIL')},3000)"
          probe "wrap-false-positive-devnull" $CLI wrap -- node -e "console.log('discarding noise with > /dev/null is harmless')"
          probe "wrap-flags-parsed" $CLI wrap --mode permissive --endpoint https://example.invalid --secret x --agent Probe -- node -e "console.log('hello')"
          probe "test-connection" $CLI test-connection
          probe "wrap-permissive-rm-rf" $CLI wrap --mode permissive -- node -e "console.log('rm -rf /'); setTimeout(function(){console.log('AGENT SURVIVED PERMISSIVE')},1500)"
          mkdir -p "$RUNNER_TEMP/gate-probe-dir"
          probe "gate-ls" $CLI gate -- ls
          probe "gate-rm-rf" $CLI gate -- rm -rf "$RUNNER_TEMP/gate-probe-dir"
          if [ -d "$RUNNER_TEMP/gate-probe-dir" ]; then echo "PROBE_RESULT|gate-rm-rf-dir-still-exists|yes"; else echo "PROBE_RESULT|gate-rm-rf-dir-still-exists|NO (deleted)"; fi
          probe "wrap-audit-rm-rf" $CLI wrap --mode audit -- node -e "console.log('rm -rf /'); setTimeout(function(){console.log('AGENT SURVIVED AUDIT')},1500)"
          probe "wrap-dd-sda-blocked" $CLI wrap -- node -e "console.log('dd if=/dev/zero of=/dev/sda')"
          mkdir -p "$RUNNER_TEMP/shim-probe"
          probe "wrap-shim-blocks-rm-via-shell" $CLI wrap -- node -e "try{require('child_process').execSync('rm -rf '+process.env.RUNNER_TEMP+'/shim-probe',{stdio:'inherit'})}catch(e){console.log('rm command failed: '+e.status)}"
          if [ -d "$RUNNER_TEMP/shim-probe" ]; then echo "PROBE_RESULT|shim-probe-dir-still-exists|yes (blocked)"; else echo "PROBE_RESULT|shim-probe-dir-still-exists|NO (deleted)"; fi
          echo 'not json at all' > "$RUNNER_TEMP/bad-policy.json"
          probe "policy-validate-garbage-file" $CLI policy validate "$RUNNER_TEMP/bad-policy.json"
          echo '{"rules":[{"name":"bad","pattern":"(unclosed"}]}' > "$RUNNER_TEMP/bad-regex-policy.json"
          probe "policy-validate-bad-regex-file" $CLI policy validate "$RUNNER_TEMP/bad-regex-policy.json"
          probe "test-connection-unreachable" $CLI test-connection --endpoint http://127.0.0.1:3999 --secret x
          probe "approve-nonexistent" $CLI approve nonexistent-id --yes
          probe "approvals" $CLI approvals

          echo "::group::PROBE silent-action-outside-workspace"
          rm -f "$RUNNER_TEMP/outside-marker"
          timeout 60 $CLI wrap -- node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP+'/outside-marker','x');console.log('agent finished')" < /dev/null 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -n 20
          if [ -f "$RUNNER_TEMP/outside-marker" ]; then echo "PROBE_RESULT|silent-action-outside-workspace|NOT_BLOCKED (file written outside workspace)"; else echo "PROBE_RESULT|silent-action-outside-workspace|blocked"; fi
          echo "::endgroup::"

          PAYLOAD=$(node -e "process.stdout.write(Buffer.from(JSON.stringify({product:'agentshield',customerId:'ci',features:['all'],issuedAt:'2026-01-01T00:00:00Z',licenseId:'ci-1',maxDevices:1,organizationId:'ci',plan:'PRO_LIFETIME',version:1})).toString('base64url'))")
          probe "license-bad-sig-plain" $CLI activate "ASL1-$PAYLOAD.notasignature"
          probe "license-bad-sig-containing-live" $CLI activate "ASL1-$PAYLOAD.notasignature-live"
          probe "license-bad-sig-containing-test" $CLI activate "ASL1-$PAYLOAD.notasignature-test"

          node -e "
          const fs=require('fs');const src=fs.readFileSync(process.env.CLIF,'utf8');
          const m=src.match(/-----BEGIN PUBLIC KEY-----[\s\S]*?-----END PUBLIC KEY-----/);
          try{const k=require('crypto').createPublicKey(m[0]);console.log('PROBE_RESULT|root-public-key-parse|ok type='+k.asymmetricKeyType)}catch(e){console.log('PROBE_RESULT|root-public-key-parse|INVALID '+e.message)}"
          probe "logs" $CLI logs

      - name: Package and consumer install
        id: pack
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/packages/cli" || exit 0
          npm pack --json > "$RUNNER_TEMP/pack.json" 2> "$RUNNER_TEMP/pack.err"
          echo "PACK|npm_pack_exit=$?"
          node -e "
          const p=require(process.env.RUNNER_TEMP+'/pack.json')[0];
          console.log('PACK|file='+p.filename+'|size_bytes='+p.size+'|unpacked_bytes='+p.unpackedSize+'|files='+p.entryCount);
          console.log('PACK|files_list='+p.files.map(f=>f.path).join(','));
          "
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer" && npm init -y > /dev/null 2>&1
          START=$(date +%s)
          npm i "$GITHUB_WORKSPACE"/packages/cli/agentshield-*.tgz --no-audit --no-fund 2>&1 | tail -n 3
          echo "PACK|consumer_install_seconds=$(( $(date +%s) - START ))"
          echo "PACK|consumer_node_modules=$(du -sh node_modules | cut -f1) top_level_packages=$(ls node_modules | wc -l)"
          npx --no-install agentshield version
          echo "PACK|consumer_cli_exit=$?"
          cd "$GITHUB_WORKSPACE"
          python3 -m py_compile lib/sdk/python/agentshield_client.py lib/sdk/python/cli.py && echo "PACK|python_sdk_compile=ok" || echo "PACK|python_sdk_compile=FAILED"

      - name: Repo hygiene and dependency audit
        id: hygiene
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          echo "HYGIENE|committed runtime/build artifacts:"
          git ls-files | grep -E '^(\.agentshield/|\.test-workspace/)|tsbuildinfo$|(^|/)\.env$'
          echo "HYGIENE|root bin vs packages/cli copy identical: $(cmp -s bin/agentshield.mjs packages/cli/bin/agentshield.mjs && echo yes || echo NO)"
          echo "HYGIENE|vercel.json:"; cat vercel.json
          echo "HYGIENE|.gitignore:"; cat .gitignore
          echo "HYGIENE|license file:"; ls LICENSE* 2>&1 | head -n 2
          echo "HYGIENE|lockfiles:"; ls bun.lock package-lock.json
          echo "HYGIENE|secret-like strings in tracked files (values redacted):"
          git grep -nIE "sec_live_prod_[0-9a-f]+|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" -- . ':!package-lock.json' ':!bun.lock' | sed -E 's/(:[0-9]+:).*/\1 [match redacted]/'
          echo "HYGIENE|npm audit (prod deps, high and above):"
          npm audit --omit=dev --audit-level=high 2>&1 | tail -n 30

      - name: Gate
        if: always()
        run: |
          echo "GATE|install=${{ steps.install.outcome }}|typecheck=${{ steps.typecheck.outcome }}|lint=${{ steps.lint.outcome }}|unit=${{ steps.unit.outcome }}|build=${{ steps.build.outcome }}|smoke=${{ steps.smoke.outcome }}|cli=${{ steps.cli.outcome }}|pack=${{ steps.pack.outcome }}|hygiene=${{ steps.hygiene.outcome }}|monetize=${{ steps.monetize.outcome }}"
          [ "${{ steps.install.outcome }}" = "success" ] && [ "${{ steps.typecheck.outcome }}" = "success" ] && [ "${{ steps.unit.outcome }}" = "success" ] && [ "${{ steps.build.outcome }}" = "success" ]
